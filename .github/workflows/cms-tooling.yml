name: cms tooling offline build

'on':
  push:
    paths:
      - '**'
      - '.github/workflows/cms-tooling.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/cms-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Python ${{ matrix.python-version }} offline qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-cms-mcp.txt
      - name: Verify installed workflow matches reviewed template
        run: cmp ci/cms-tooling.yml .github/workflows/cms-tooling.yml
      - name: Install offline test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends git s3270 regina-rexx
      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-cms-mcp.txt
      - name: Build and qualify isolated source package without CMS
        run: python -B build_cms_tooling.py
      - name: Retain build reports and source archive
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cms-tooling-python-${{ matrix.python-version }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            builds/**/build-report.json
            builds/**/local-review-evidence.json
            builds/**/operation-review-evidence.json
            builds/**/rehearsal-evidence.json
            builds/**/cms-tooling.tar.gz
