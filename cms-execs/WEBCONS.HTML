<!doctype html>
<html><head><meta charset="us-ascii">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMS Web Console</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}
header{padding:12px 16px;background:#1b1b1b;border-bottom:1px solid #333}
main{padding:16px;max-width:1100px;margin:0 auto}
.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
input,button,textarea{font:14px/1.3 monospace;padding:8px;border:1px solid #444;
 background:#181818;color:#eee;border-radius:4px}
button{cursor:pointer;background:#2a2a2a}button:hover{background:#333}
#out{white:pre-wrap;background:#0c0c0c;padding:12px;min-height:280px;
 border:1px solid #333;border-radius:4px;overflow:auto}
.warn{color:#f0c36a;font-size:13px}
.ok{color:#8fd18f}.err{color:#ff8f8f}
label{font-size:13px;color:#bbb}
</style></head><body>
<header><strong>z/VM CMS Web Console</strong>
<div class="warn">Plain HTTP on isolated LAN. No TLS. Credentials and
commands travel in cleartext on the network.</div></header>
<main>
<div id="loginBox" style="display:none">
 <div class="row"><label>User <input id="user" autocomplete="username"></label>
 <label>Password <input id="pass" type="password"
 autocomplete="current-password"></label>
 <button onclick="login()">Log in</button></div>
 <div id="loginMsg" class="warn"></div>
</div>
<div id="app" style="display:none">
 <div class="row" style="justify-content:space-between;align-items:center">
  <strong>z/VM Performance</strong>
  <span><span id="perfTs" class="warn"></span>
  <button onclick="logout()">Log out</button></span>
 </div>
 <div id="dash" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0"></div>
 <svg id="cpuChart" width="100%" height="120" style="background:#0c0c0c;border:1px solid #333;border-radius:4px;margin-bottom:12px"></svg>
 <div style="font-size:12px;color:#bbb;margin-bottom:4px">System activity (no syslog daemon in z/VM 6.3)</div>
 <pre id="syslog" style="background:#0c0c0c;border:1px solid #333;border-radius:4px;padding:8px;max-height:160px;overflow:auto;font-size:12px;margin:0 0 12px"></pre>
 <div class="row">
  <select id="cmd" style="font:14px/1.3 monospace;padding:8px;border:1px solid #444;background:#181818;color:#eee;border-radius:4px;min-width:320px">
   <option value="QUERY USERID">QUERY USERID</option>
   <option value="QUERY NAMES">QUERY NAMES</option>
   <option value="QUERY USERS">QUERY USERS</option>
   <option value="QUERY DASD">QUERY DASD</option>
   <option value="QUERY ALLOC">QUERY ALLOC</option>
   <option value="QUERY STORAGE">QUERY STORAGE</option>
   <option value="QUERY VIRTUAL">QUERY VIRTUAL</option>
   <option value="QUERY CPLEVEL">QUERY CPLEVEL</option>
   <option value="QUERY TIME">QUERY TIME</option>
   <option value="QUERY TIMEZONE">QUERY TIMEZONE</option>
   <option value="QUERY SET">QUERY SET</option>
   <option value="QUERY SHARE">QUERY SHARE</option>
   <option value="QUERY LINKS">QUERY LINKS</option>
   <option value="QUERY MDCACHE">QUERY MDCACHE</option>
   <option value="QUERY MDC">QUERY MDC</option>
   <option value="QUERY SRM">QUERY SRM</option>
   <option value="QUERY PROCESSORS">QUERY PROCESSORS</option>
   <option value="QUERY PRIVCLASS">QUERY PRIVCLASS</option>
   <option value="QUERY TERM">QUERY TERM</option>
   <option value="QUERY TERMINAL">QUERY TERMINAL</option>
   <option value="QUERY LOGMSG">QUERY LOGMSG</option>
   <option value="QUERY READER">QUERY READER</option>
   <option value="QUERY PRINTER">QUERY PRINTER</option>
   <option value="QUERY PUNCH">QUERY PUNCH</option>
   <option value="QUERY FILES">QUERY FILES</option>
   <option value="QUERY NLS">QUERY NLS</option>
   <option value="QUERY LINES">QUERY LINES</option>
   <option value="QUERY PF">QUERY PF</option>
   <option value="QUERY TRACE">QUERY TRACE</option>
   <option value="QUERY PRODUCT">QUERY PRODUCT</option>
   <option value="QUERY CPLOAD">QUERY CPLOAD</option>
   <option value="QUERY CPUID">QUERY CPUID</option>
   <option value="QUERY SSI">QUERY SSI</option>
   <option value="QUERY SYSTEM">QUERY SYSTEM</option>
   <option value="QUERY TDISK">QUERY TDISK</option>
   <option value="QUERY VMLAN">QUERY VMLAN</option>
   <option value="QUERY VSWITCH">QUERY VSWITCH</option>
   <option value="QUERY NIC">QUERY NIC</option>
   <option value="QUERY CONTROLLER">QUERY CONTROLLER</option>
   <option value="QUERY CRYPTO">QUERY CRYPTO</option>
   <option value="QUERY EDEVICE">QUERY EDEVICE</option>
   <option value="QUERY HCD">QUERY HCD</option>
   <option value="QUERY IOASSIST">QUERY IOASSIST</option>
   <option value="QUERY SXSPAGES">QUERY SXSPAGES</option>
   <option value="QUERY XSTORE">QUERY XSTORE</option>
  </select>
  <button onclick="runCmd()">Run</button>
 </div>
 <div class="row warn">Select a CP QUERY command. Output capped and audited.</div>
 <div id="status" class="ok"></div>
 <div id="out"></div>
</div>
</main>
<script>
let CSRF='';
const D={
 avg:'Average CPU busy across all online processors.',
 proc:'CPU busy for this individual processor.',
 users:'Logged-on virtual machines (QUERY USERS).',
 dialed:'Users connected through dialed lines (QUERY USERS).',
 net:'Users connected through VTAM/RSCS/network (QUERY USERS).',
 paging:'Page movement rate, pages/second (INDICATE LOAD).',
 mdchit:'Minidisk cache hit ratio (INDICATE LOAD).',
 mdcrw:'Minidisk cache reads and writes per second.',
 q0:'Q0: virtual machines in dispatch list, in queue (INDICATE LOAD).',
 q1:'Q1: dispatch list, short-running users (INDICATE LOAD).',
 q2:'Q2: dispatch list, medium-running users (INDICATE LOAD).',
 q3:'Q3: dispatch list, long-running users (INDICATE LOAD).',
 e1:'E1: eligible list 1, waiting for dispatch list (INDICATE LOAD).',
 e2:'E2: eligible list 2 (INDICATE LOAD).',
 e3:'E3: eligible list 3 (INDICATE LOAD).',
 dorm:'Dormant: logged-on users not in dispatch/eligible lists.',
 lim:'LIMITED: users prevented from entering dispatch list.',
 disp:'Dispatchable users (INDICATE ACTIVE).',
 elig:'Eligible users waiting for dispatch list (INDICATE ACTIVE).',
 spool:'Spool space in use on this volume (CP QUERY ALLOC).',
 page:'Paging space in use on this volume (CP QUERY ALLOC).',
 drct:'CP directory space in use on this volume (CP QUERY ALLOC).',
 ctime:'CTIME: virtual CPU time charged, includes supervisor.',
 vtime:'VTIME: virtual CPU time used in problem state.',
 ttime:'TTIME: total CPU time (supervisor + problem state).',
 io:'I/O: non-spooled I/O operations started by user.',
 res:'RES: resident pages in host storage.',
 ws:'WS: working-set pages.',
 inst:'INSTAN: instantiated pages.',
 pread:'READS: page reads from paging space.',
 pwrite:'WRITES: page writes to paging space.'};
function tip(k){return D[k]?' title="'+D[k]+'"':''}
async function api(path, body, extra) {
  const h = {'Content-Type':'application/json'};
  if (extra && extra.csrf) h['X-CSRF-Token'] = extra.csrf;
  const r = await fetch(path, {method:'POST', headers:h,
    body: JSON.stringify(body||{})});
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch(e) { j = {ok:false,output:t}; }
  return j;
}
function show(out, cls) {
  const e = document.getElementById('status');
  e.className = cls||'ok'; e.textContent = out;
}
async function login() {
  const j = await api('/api/login', {
    user: document.getElementById('user').value,
    pass: document.getElementById('pass').value});
  if (j.ok) {
    CSRF = j.csrf || '';
    document.getElementById('loginBox').style.display='none';
    document.getElementById('app').style.display='block';
    show('logged in', 'ok');
  } else {
    document.getElementById('loginBox').style.display='block';
    show(j.error||'login failed', 'err');
  }
  document.getElementById('loginMsg').textContent = j.error||'';
}
async function runCmd() {
  const cmd = document.getElementById('cmd').value;
  show('running...', 'warn');
  const j = await api('/api/cmd', {cmd: cmd}, {csrf: CSRF});
  show(j.ok ? ('rc=' + j.rc) : (j.error||'error'), j.ok?'ok':'err');
  document.getElementById('out').textContent = j.output||'';
}
async function logout() { await api('/api/logout',{}); location.reload(); }
document.getElementById('cmd').addEventListener('keydown', e => {
  if (e.key === 'Enter') runCmd();
});

let cpuHist=[];
async function pollLog(){
  try{
    const r=await fetch('/api/log',{credentials:'same-origin'});
    const j=await r.json();
    if(!j.ok) return;
    const lines=[];
    const lm=(j.logmsg||'').trim();
    if(lm && !/no logmsg/i.test(lm)) lines.push('logon message: '+lm);
    (j.events||[]).forEach(function(e){ lines.push(e); });
    document.getElementById('syslog').textContent =
      lines.length ? lines.join('\n') : 'no events yet';
  }catch(e){}
}
async function pollPerf(){
  try{
    const r=await fetch('/api/perf',{credentials:'same-origin'});
    const j=await r.json();
    if(!j.ok) return;
    renderPerf(j);
  }catch(e){}
}
function card(title,val,sub,defKey){
  const t=defKey?tip(defKey):'';
  return `<div style="background:#181818;border:1px solid #333;border-radius:6px;padding:10px"${t}>
  <div style="color:#bbb;font-size:12px"><span class="${defKey?'def':''}">${title}</span></div>
  <div style="font-size:28px;font-weight:600">${val}</div>
  <div style="color:#888;font-size:12px">${sub||''}</div></div>`;
}
function bar(label,pct,color,defKey){
  pct=Math.max(0,Math.min(100,Number(pct)||0));
  const t=defKey?tip(defKey):'';
  return `<div style="margin:6px 0"${t}><div style="font-size:12px;color:#bbb"><span class="${defKey?'def':''}">${label}</span> ${pct}%</div>
  <div style="background:#333;border-radius:4px;height:10px"><div style="width:${pct}%;height:10px;border-radius:4px;background:${color}"></div></div></div>`;
}
function renderPerf(j){
  document.getElementById('perfTs').textContent=new Date().toLocaleTimeString();
  cpuHist.push(Number(j.avgproc)||0); if(cpuHist.length>60) cpuHist.shift();
  const procs=(j.procs||[]).map(p=>'<span class="def"'+tip('proc')+'>P'+p.id+':'+p.pct+'%</span>').join(' ');
  const qsub='<span class="def"'+tip('q2')+'>Q2</span>:'+j.q2+' <span class="def"'+tip('q3')+'>Q3</span>:'+j.q3+' <span class="def"'+tip('dorm')+'>Dorm</span>:'+j.dormant;
  const cards=[
    card('CPU Avg', j.avgproc+'%', (j.nproc||0)+' processor(s)'+(procs?' | '+procs:''), 'avg'),
    card('Users', j.users, j.dialed+' dialed, '+j.net+' net', 'users'),
    card('Paging', j.paging+'/s', 'MDC hit '+j.mdchit+'%', 'paging'),
    card('Queues', 'Q0:'+j.q0+' Q1:'+j.q1, qsub, 'q1')
  ].join('');
  const bars=(j.vols||[]).map(v=>{
    const k=v.type.toLowerCase();
    const c=k==='spool'?'#4a9eff':k==='page'?'#f0c36a':'#9ad17b';
    return bar(v.vol+' '+v.type, v.pct, c, k);
  }).join('') || bar('Spool used', j.spoolpct, '#4a9eff','spool')+bar('Page used', j.pagepct, '#f0c36a','page');
  const extra=`<div style="background:#181818;border:1px solid #333;border-radius:6px;padding:10px;font-size:12px;color:#bbb">
  <div><span class="def"${tip('mdcrw')}>MDC</span> reads ${j.mdcr||0}/s writes ${j.mdcw||0}/s hit ${j.mdchit||0}%</div>
  <div><span class="def"${tip('e1')}>E1</span>:${j.e1||0} <span class="def"${tip('e2')}>E2</span>:${j.e2||0} <span class="def"${tip('e3')}>E3</span>:${j.e3||0} <span class="def"${tip('lim')}>Limited</span>:${j.limited||0}</div>
  <div><span class="def"${tip('disp')}>Disp</span>:${j.disp||0} <span class="def"${tip('elig')}>Elig</span>:${j.elig||0} <span class="def"${tip('dorm')}>Dorm</span>:${j.dormant||0}</div>
  </div>`;
  document.getElementById('dash').innerHTML=cards+`<div style="background:#181818;border:1px solid #333;border-radius:6px;padding:10px">${bars}</div>`+extra;
  drawCpu();
}
function drawCpu(){
  const svg=document.getElementById('cpuChart');
  const w=svg.clientWidth||600,h=120,pad=8;
  const max=100;
  let pts='';
  for(let i=0;i<cpuHist.length;i++){
    const x=pad+(i/Math.max(1,cpuHist.length-1))*(w-2*pad);
    const y=h-pad-(cpuHist[i]/max)*(h-2*pad);
    pts+=`${x},${y} `;
  }
  const last=cpuHist.length?cpuHist[cpuHist.length-1]:0;
  svg.innerHTML=`<text x="8" y="18" fill="#bbb" font-size="12">CPU % (last ${cpuHist.length}s)</text>
  <text x="${w-8}" y="18" fill="#8fd18f" font-size="12" text-anchor="end">${last}%</text>
  <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#333"/>
  <line x1="${pad}" y1="${pad}" x2="${w-pad}" y2="${pad}" stroke="#222"/>
  <polyline fill="none" stroke="#8fd18f" stroke-width="2" points="${pts}"/>`;
}
async function pollTop(){
  try{
    const r=await fetch('/api/top',{credentials:'same-origin'});
    const j=await r.json();
    if(!j.ok) return;
    const rows=(j.users||[]).map(u=>`<tr><td>${esc(u.id)}</td>
    <td${tip('ctime')}>${esc(u.ctime||'')}</td>
    <td${tip('vtime')}>${esc(u.vtime||'')}</td>
    <td${tip('ttime')}>${esc(u.ttime||'')}</td>
    <td${tip('io')}>${u.io||0}</td>
    <td${tip('res')}>${u.res||0}</td>
    <td${tip('ws')}>${u.ws||0}</td>
    <td${tip('inst')}>${u.inst||0}</td>
    <td${tip('pread')}>${u.pread||0}</td>
    <td${tip('pwrite')}>${u.pwrite||0}</td></tr>`).join('');
    document.getElementById('top').innerHTML=`<table>
    <thead><tr><th>User</th><th class="def"${tip('ctime')}>CTIME</th>
    <th class="def"${tip('vtime')}>VTIME</th><th class="def"${tip('ttime')}>TTIME</th>
    <th class="def"${tip('io')}>I/O</th><th class="def"${tip('res')}>RES</th>
    <th class="def"${tip('ws')}>WS</th><th class="def"${tip('inst')}>INSTAN</th>
    <th class="def"${tip('pread')}>PREAD</th><th class="def"${tip('pwrite')}>PWRIT</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="10">no data</td></tr>'}</tbody></table>`;
  }catch(e){}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const _login=login;
login=async function(){
  await _login();
  if(document.getElementById('app').style.display==='none') return;
  pollPerf(); pollLog(); pollTop();
  if(window._perfTimer) clearInterval(window._perfTimer);
  window._perfTimer=setInterval(pollPerf,5000);
  if(window._logTimer) clearInterval(window._logTimer);
  window._logTimer=setInterval(pollLog,10000);
  if(window._topTimer) clearInterval(window._topTimer);
  window._topTimer=setInterval(pollTop,60000);
};
window.addEventListener("load",()=>{ login(); });
</script></body></html>
